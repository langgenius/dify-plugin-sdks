[project]
name = 'dify-plugin'
version = "0.11.0"
description = 'Dify Plugin SDK'
authors = [{ name = 'langgenius', email = 'hello@dify.ai' }]
dependencies = [
    'Flask>=3.1.3',
    'Werkzeug>=3.1.9',
    'gevent>=26.9.0',
    'h11>=0.16.0',
    'httpx2>=2.16.0',
    'httpcore2>=2.16.0',
    'pydantic_settings>=2.15.0',
    'pydantic>=2.14.1',
    'pyyaml>=6.0.3',
    'socksio>=1.0.0',
    'tiktoken>=0.14.0',
    'yarl>=1.25.1',
    'packaging>=26.3',
]
requires-python = '>=3.12'
readme = 'README.md'
license = 'Apache-2.0'
license-files = ['LICENSE']
keywords = ['dify', 'plugin', 'sdk']

[project.urls]
source = 'https://github.com/langgenius/dify-plugin-sdks'
homepage = 'https://github.com/langgenius/dify-plugin-sdks'
issues = 'https://github.com/langgenius/dify-plugin-sdks/issues'

[build-system]
requires = ['uv_build~=0.13.0']
build-backend = 'uv_build'

[dependency-groups]
dev = [
    "hypothesis>=6.169.0",
    'prek',
    'pytest',
    'pytest-cov',
    "pytest-httpserver>=1.2.0",
    'pytest-mock',
    "pytest-timeout>=2.4.0",
    'ruff',
    "trustme>=1.2.1",
    'ty',
]

[tool.uv]
default-groups = ['dev']

[tool.pytest]
minversion = '9.0'
testpaths = ['tests']
addopts = ['--strict-config', '--strict-markers']
# pytest-timeout registers a string ini value, even with pytest's native TOML config.
timeout = '60'
xfail_strict = true
markers = ['integration: runs a real plugin process or local protocol service']
filterwarnings = [
    'error::ResourceWarning',
    'error::pytest.PytestUnhandledThreadExceptionWarning',
    'error::pytest.PytestUnraisableExceptionWarning',
]

[tool.coverage.run]
branch = true
source_pkgs = ['dify_plugin']
# SDK threads are monkey-patched greenlets; a second thread tracer drops events.
concurrency = ['gevent']
patch = ['subprocess']
sigterm = true

[tool.coverage.paths]
source = ['src/dify_plugin', '*/site-packages/dify_plugin']

[tool.ruff]
preview = true
required-version = '>=0.15.22'

[tool.ruff.lint]
select = ['ALL']
ignore = [
    'too-many-statements', # Too broad for orchestration-heavy SDK functions.
    'commented-out-code',  # False positives are common.
    'too-many-branches',
    'too-many-locals',
    'raise-vanilla-class',
    'blind-except',
    'raise-within-try',
    'too-many-arguments', # Explicit is better than implicit.
    'too-many-positional-arguments', # Complex is better than complicated.
    'complex-structure',
    'FBT',     # Too strict.
    'TC',      # Runtime use of typing constructs is common now.
    'relative-imports',  # Too absolute.
    'no-self-use', # Violates the usual practice.
    'missing-trailing-comma',  # Conflicts with `ruff format`.
    'CPY',     # Covered by the standalone LICENSE file.
    'D',       # Too verbose.
]

[tool.ruff.lint.pydoclint]
ignore-one-line-docstrings = true

[tool.ruff.lint.per-file-ignores]
'tests/**/*.py' = [
    'assert',    # Assert statements used for pytest.
    'private-member-access',  # Tests may inspect private implementation details.
    'magic-value-comparison', # Magic value used in test cases.
]
